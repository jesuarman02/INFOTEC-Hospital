# ===================================================================
# Spring Boot configuration.
# ===================================================================

---
spring:
  config:
    activate:
      on-profile: '!api-docs'

springdoc:
  api-docs:
    enabled: false

---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - liquibase

  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

    jhimetrics:
      enabled: true

  info:
    git:
      mode: full
    env:
      enabled: true

  health:
    mail:
      enabled: false

  prometheus:
    metrics:
      export:
        enabled: true
        step: 60

  observations:
    key-values:
      application: ${spring.application.name}

  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: pacientesms

  cloud:
    consul:
      discovery:
        healthCheckPath: /management/health
        instanceId: pacientesms:${spring.application.instance-id:${random.value}}
        service-name: pacientesms
      config:
        watch:
          enabled: false

  profiles:
    active: '@spring.profiles.active@'
    group:
      dev:
        - dev
        - api-docs

  jmx:
    enabled: false

  messages:
    basename: i18n/messages

  main:
    allow-bean-definition-overriding: true

  webflux:
    problemdetails:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth

  task:
    execution:
      thread-name-prefix: pacientesms-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: pacientesms-scheduling-
      pool:
        size: 2

  thymeleaf:
    mode: HTML

  output:
    ansi:
      enabled: always

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

info:
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster properties
# ===================================================================

jhipster:
  clientApp:
    name: 'pacientesmsApp'

  mail:
    from: pacientesms@localhost

  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Pacientesms API
    description: Pacientesms API documentation
    version: 0.0.1

# ===================================================================
# LOGGING
# ===================================================================

logging:
  level:
    ROOT: INFO
    mx:
      infotec:
        pacientesms: INFO
    io:
      r2dbc:
        postgresql:
          PARAM: INFO
          QUERY: INFO
    org:
      springframework:
        data:
          r2dbc: INFO
        r2dbc: INFO
      hibernate:
        SQL: ERROR
        type:
          descriptor:
            sql:
              BasicBinder: ERROR